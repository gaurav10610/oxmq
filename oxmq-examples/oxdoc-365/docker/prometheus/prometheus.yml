global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'oxdoc-365'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 2s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'oxdoc-365'
          framework: 'oxmq'

  - job_name: 'redis'
    scrape_interval: 2s
    static_configs:
      - targets: ['oxdoc-redis-exporter:9121']
        labels:
          service: 'redis'
          instance: 'oxdoc-redis'
