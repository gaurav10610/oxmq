name: oxdoc-365

services:
  oxdoc-redis:
    image: redis:7-alpine
    container_name: oxdoc-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  oxdoc-redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: oxdoc-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://oxdoc-redis:6379
    depends_on:
      - oxdoc-redis

  oxdoc-postgres:
    image: postgres:16-alpine
    container_name: oxdoc-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oxdoc
      POSTGRES_USER: oxdoc
      POSTGRES_PASSWORD: oxdoc
    volumes:
      - oxdoc_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  oxdoc-bullboard:
    image: ghcr.io/felixmosh/bull-board:latest
    container_name: oxdoc-bullboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: ["--redis", "redis://oxdoc-redis:6379", "--prefix", "oxdoc-365", "--queues", "tenant-discovery-queue,drive-delta-sync-queue,content-categorization-queue,document-extraction-queue,catalog-index-queue"]
    depends_on:
      - oxdoc-redis

  oxdoc-prometheus:
    image: prom/prometheus:latest
    container_name: oxdoc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  oxdoc-grafana:
    image: grafana/grafana:latest
    container_name: oxdoc-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - oxdoc-prometheus

volumes:
  oxdoc_pgdata:
