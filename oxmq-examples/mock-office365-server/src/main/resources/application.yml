server:
  port: 8081

spring:
  application:
    name: mock-office365-server
  main:
    banner-mode: console

oxdoc:
  mock-server:
    enabled: true
    port: 8081
    storage-dir: "./data/m365-storage"
    scale-mode: "ENTERPRISE_TIERED"
    total-files: 231000
    smb-files: 1000
    mid-files: 5000
    ent-files: 25000
    large-files: 100000
    global-files: 100000
    simulate-429-burst: false
  webhook:
    client-state: "oxdoc-secret-state-token"
    notification-url: "http://localhost:8080/api/v1/webhooks/graph"
