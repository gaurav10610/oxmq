name: oxguard-365

services:
  oxguard-redis:
    image: redis:7-alpine
    container_name: oxguard-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  oxguard-postgres:
    image: postgres:16-alpine
    container_name: oxguard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oxguard
      POSTGRES_USER: oxguard
      POSTGRES_PASSWORD: oxguard
    volumes:
      - oxguard_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  oxguard-bullboard:
    image: ghcr.io/felixmosh/bull-board:latest
    container_name: oxguard-bullboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: ["--redis", "redis://oxguard-redis:6379", "--prefix", "oxguard-365", "--queues", "tenant-discovery-queue,drive-delta-sync-queue,file-permission-queue,file-malware-queue,file-aggregate-queue"]
    depends_on:
      - oxguard-redis

  oxguard-prometheus:
    image: prom/prometheus:latest
    container_name: oxguard-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  oxguard-grafana:
    image: grafana/grafana:latest
    container_name: oxguard-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - oxguard-prometheus

volumes:
  oxguard_pgdata:
