apiVersion: v1
kind: Namespace
metadata:
  name: oxguard-system
  labels:
    app.kubernetes.io/name: oxguard-365
    app.kubernetes.io/part-of: oxmq-ecosystem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oxguard-config
  namespace: oxguard-system
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "30s"
  OXMQ_REDIS_URL: "redis://oxguard-redis:6379"
  OXMQ_WORKER_CONCURRENCY: "25"
  OXMQ_WORKER_DRAIN_TIMEOUT: "30s"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://oxguard-postgres:5432/oxguard"
  OXGUARD_AZURE_GRAPH_BASE_URL: "http://mock-office365:8081/v1.0"
  OXGUARD_AZURE_LOGIN_BASE_URL: "http://mock-office365:8081"
  OXGUARD_MOCK_ADMIN_BASE_URL: "http://mock-office365:8081/mock-admin"
