apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oxguard-redis
  namespace: oxguard-system
spec:
  serviceName: oxguard-redis
  replicas: 1
  selector:
    matchLabels:
      app: oxguard-redis
  template:
    metadata:
      labels:
        app: oxguard-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: oxguard-redis
  namespace: oxguard-system
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: oxguard-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oxguard-postgres
  namespace: oxguard-system
spec:
  serviceName: oxguard-postgres
  replicas: 1
  selector:
    matchLabels:
      app: oxguard-postgres
  template:
    metadata:
      labels:
        app: oxguard-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: "oxguard"
            - name: POSTGRES_USER
              value: "oxguard"
            - name: POSTGRES_PASSWORD
              value: "oxguard"
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "oxguard", "-d", "oxguard"]
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "oxguard", "-d", "oxguard"]
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: oxguard-postgres
  namespace: oxguard-system
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: oxguard-postgres
