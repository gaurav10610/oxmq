global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'oxmq-spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'oxmq-spring-boot-example'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
