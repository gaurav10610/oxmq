name: OxMQ CI / Test Suite

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        java-version: [ '21', '22' ]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Redis on macOS (non-container service fallback)
        if: runner.os == 'macOS'
        run: |
          brew install redis
          brew services start redis
          sleep 2
          redis-cli ping

      - name: Build & Run Full Test Suite with Maven
        run: mvn clean test -B
        env:
          OXMQ_REDIS_URI: redis://localhost:6379

      - name: Publish Test Results
        if: always()
        uses: scacap/action-surefire-report@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          check_name: "Surefire Test Report (Java ${{ matrix.java-version }} - ${{ matrix.os }})"
