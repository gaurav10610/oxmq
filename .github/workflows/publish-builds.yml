name: Build & Publish OxMQ

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test & Verify (Java 21 + Redis 7)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Full Test Suite
        run: mvn clean test -B
        env:
          OXMQ_REDIS_URI: redis://localhost:6379

  package-and-publish:
    name: Package & Publish Builds
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 with GitHub Packages Registry
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          cache: 'maven'

      - name: Build and Package JARs
        run: mvn clean package -DskipTests -B

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          # Only include essential packages (oxmq-core and oxmq-spring-boot-starter)
          cp oxmq-core/target/oxmq-core-*.jar release-artifacts/
          cp oxmq-spring-boot-starter/target/oxmq-spring-boot-starter-*.jar release-artifacts/
          rm -f release-artifacts/*-sources.jar release-artifacts/*-javadoc.jar release-artifacts/*.original
          ls -lh release-artifacts/

      - name: Upload Actions Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oxmq-build-artifacts
          path: release-artifacts/*
          retention-days: 30

      - name: Publish Maven Packages to GitHub Packages
        run: |
          mvn deploy -DskipTests -B || echo "::warning::Package version already published to GitHub Packages. Skipping duplicate deploy."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge Unnecessary Legacy Packages from GitHub Packages
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in "io.oxmq.oxmq-benchmarks" "io.oxmq.cloudbridge" "io.oxmq.oxmq-examples"; do
            echo "Checking status of $pkg in registry..."
            res=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/maven/$pkg")
            http_code=$(echo "$res" | tail -n1)
            echo "Package $pkg status: $http_code"
            if [ "$http_code" = "200" ]; then
              echo "Attempting to purge package $pkg..."
              del_res=$(curl -s -w "\n%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/user/packages/maven/$pkg")
              del_code=$(echo "$del_res" | tail -n1)
              del_body=$(echo "$del_res" | sed '$d')
              echo "Purge result for $pkg: $del_code - $del_body"
            fi
          done

      - name: Update GitHub Release Assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$LATEST_TAG" ]; then
            echo "Latest release identified as: $LATEST_TAG"
            echo "Uploading essential release assets to $LATEST_TAG:"
            ls -lh release-artifacts/
            gh release upload "$LATEST_TAG" release-artifacts/*.jar --clobber
            echo "Release $LATEST_TAG assets successfully updated."
          else
            echo "No existing release found. Skipping release asset upload."
          fi
